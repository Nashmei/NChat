name: Build NChat IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build NChat
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Prepare AppIcon assets
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="NChat/Assets.xcassets/AppIcon.appiconset"
          SOURCE="$ICON_DIR/AppIcon-1024.png"
          test -f "$SOURCE"
          file "$SOURCE"
          WIDTH="$(sips -g pixelWidth "$SOURCE" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$SOURCE" | awk '/pixelHeight/ {print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          sips -z 40 40 "$SOURCE" --out "$ICON_DIR/AppIcon-40.png" >/dev/null
          sips -z 60 60 "$SOURCE" --out "$ICON_DIR/AppIcon-60.png" >/dev/null
          sips -z 58 58 "$SOURCE" --out "$ICON_DIR/AppIcon-58.png" >/dev/null
          sips -z 87 87 "$SOURCE" --out "$ICON_DIR/AppIcon-87.png" >/dev/null
          sips -z 80 80 "$SOURCE" --out "$ICON_DIR/AppIcon-80.png" >/dev/null
          sips -z 120 120 "$SOURCE" --out "$ICON_DIR/AppIcon-120-40.png" >/dev/null
          sips -z 120 120 "$SOURCE" --out "$ICON_DIR/AppIcon-120.png" >/dev/null
          sips -z 180 180 "$SOURCE" --out "$ICON_DIR/AppIcon-180.png" >/dev/null
          for file in "$ICON_DIR"/AppIcon-*.png; do
            test -s "$file"
          done

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d NChat.xcodeproj

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf DerivedData
          xcodebuild \
            -project NChat.xcodeproj \
            -scheme NChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release-iphoneos/NChat.app"
          test -d "$APP"
          rm -rf Payload NChat-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/NChat.app
          zip -qry NChat-unsigned.ipa Payload
          ls -lh NChat-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NChat-IPA
          path: NChat-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NChat-Build-Log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
