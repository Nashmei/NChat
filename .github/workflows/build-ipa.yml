name: Build Crown Gardens IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare AppIcon
        run: |
          set -euo pipefail
          D="NChat/Assets.xcassets/AppIcon.appiconset"; S="$D/AppIcon-1024.png"; test -s "$S"
          sips -z 40 40 "$S" --out "$D/AppIcon-40.png" >/dev/null
          sips -z 60 60 "$S" --out "$D/AppIcon-60.png" >/dev/null
          sips -z 58 58 "$S" --out "$D/AppIcon-58.png" >/dev/null
          sips -z 87 87 "$S" --out "$D/AppIcon-87.png" >/dev/null
          sips -z 80 80 "$S" --out "$D/AppIcon-80.png" >/dev/null
          sips -z 120 120 "$S" --out "$D/AppIcon-120.png" >/dev/null
          sips -z 180 180 "$S" --out "$D/AppIcon-180.png" >/dev/null
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project CrownGardens.xcodeproj -scheme CrownGardens -showBuildSettings > build-settings.txt
      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild -project CrownGardens.xcodeproj -scheme CrownGardens -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build | tee xcodebuild.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"; test -f "$APP/Info.plist"
          rm -rf Payload CrownGardens-unsigned.ipa
          mkdir Payload
          cp -R "$APP" "Payload/$(basename "$APP")"
          zip -qry CrownGardens-unsigned.ipa Payload
          test -s CrownGardens-unsigned.ipa
          ls -lh CrownGardens-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrownGardens-Unsigned-IPA
          path: CrownGardens-unsigned.ipa
          retention-days: 30
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CrownGardens-Build-Log
          path: |
            xcodebuild.log
            build-settings.txt
          if-no-files-found: ignore
