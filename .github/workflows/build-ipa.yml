name: Build Prompt Wars IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Prompt Wars
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Prepare AppIcon assets
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="NChat/Assets.xcassets/AppIcon.appiconset"
          SOURCE="$ICON_DIR/AppIcon-1024.png"
          test -s "$SOURCE"
          file "$SOURCE"
          WIDTH="$(sips -g pixelWidth "$SOURCE" | awk '/pixelWidth/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$SOURCE" | awk '/pixelHeight/ {print $2}')"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          sips -z 40 40 "$SOURCE" --out "$ICON_DIR/AppIcon-40.png" >/dev/null
          sips -z 60 60 "$SOURCE" --out "$ICON_DIR/AppIcon-60.png" >/dev/null
          sips -z 58 58 "$SOURCE" --out "$ICON_DIR/AppIcon-58.png" >/dev/null
          sips -z 87 87 "$SOURCE" --out "$ICON_DIR/AppIcon-87.png" >/dev/null
          sips -z 80 80 "$SOURCE" --out "$ICON_DIR/AppIcon-80.png" >/dev/null
          sips -z 120 120 "$SOURCE" --out "$ICON_DIR/AppIcon-120-40.png" >/dev/null
          sips -z 120 120 "$SOURCE" --out "$ICON_DIR/AppIcon-120.png" >/dev/null
          sips -z 180 180 "$SOURCE" --out "$ICON_DIR/AppIcon-180.png" >/dev/null
          for icon in "$ICON_DIR"/AppIcon-*.png; do test -s "$icon"; done

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d NChat.xcodeproj
          xcodebuild -project NChat.xcodeproj -scheme NChat -showBuildSettings > build-settings.txt
          grep -E "PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|WRAPPER_NAME" build-settings.txt

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf DerivedData
          xcodebuild             -project NChat.xcodeproj             -scheme NChat             -configuration Release             -sdk iphoneos             -derivedDataPath DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build | tee xcodebuild.log

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="DerivedData/Build/Products/Release-iphoneos"
          APP="$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          test -f "$APP/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -n "$EXECUTABLE"
          test -f "$APP/$EXECUTABLE"
          echo "Packaging: $APP"
          rm -rf Payload PromptWars-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" "Payload/$(basename "$APP")"
          zip -qry PromptWars-unsigned.ipa Payload
          test -s PromptWars-unsigned.ipa
          unzip -l PromptWars-unsigned.ipa | head -40
          ls -lh PromptWars-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PromptWars-IPA
          path: PromptWars-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PromptWars-Build-Diagnostics
          path: |
            xcodebuild.log
            build-settings.txt
          if-no-files-found: ignore
          retention-days: 7
