name: Build NChat IPA
on:
  workflow_dispatch:
  push:
    branches: ["**"]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project NChat.xcodeproj -scheme NChat -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | xcpretty
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/NChat.app Payload/
          zip -qry NChat-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NChat-IPA
          path: NChat-unsigned.ipa
          retention-days: 30
